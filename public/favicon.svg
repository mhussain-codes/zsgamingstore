      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161E2E"/>
      <stop offset="100%" stop-color="#0B0F17"/>
