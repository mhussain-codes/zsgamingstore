<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" fill="none">
  <defs>
    <linearGradient id="logo-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161E2E"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
  </defs>
  <!-- Monogram Icon -->
  <g transform="translate(2, 2)">
    <rect width="48" height="48" rx="10" fill="url(#logo-bg)" stroke="#24324B" stroke-width="1.5"/>
    <path d="M14 15H25L17 24H28" stroke="url(#logo-cyan)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 24C34 21 31 19 28 19C24 19 21 21 21 24C21 28 34 27 34 32C34 35.5 30.5 37 27 37C22.5 37 20 34.5 20 32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="14" r="2" fill="#00E5FF"/>
  </g>
  <!-- Text Brand -->
  <g transform="translate(62, 10)">
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
      ZS<tspan fill="#00E5FF">.</tspan>GAMING
    </text>
    <text x="1" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#94A3B8">
      CUSTOM RIGS &amp; HARDWARE
    </text>
    <!-- Pakistan flag-colored pill or badge -->
